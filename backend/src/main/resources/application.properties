spring.application.name=hospital-management-backend
spring.config.import=optional:file:.env[.properties]
server.port=8080
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# Local MySQL development settings. Override DB_USERNAME and DB_PASSWORD in your shell.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_management?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Supply the local development Admin seed through environment variables.
app.auth.seed-admin-email=${SEED_ADMIN_EMAIL:}
app.auth.seed-admin-password=${SEED_ADMIN_PASSWORD:}
app.auth.seed-admin-name=${SEED_ADMIN_NAME:Administrator}
# Development-only: set RESET_ADMIN_PASSWORD=true for one startup to replace
# the existing seeded Admin BCrypt hash with SEED_ADMIN_PASSWORD, then unset it.
app.auth.reset-admin-password=${RESET_ADMIN_PASSWORD:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
